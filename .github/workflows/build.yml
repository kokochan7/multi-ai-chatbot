name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Each build gets its own version, 1.0.<run number>, so the app's
      # "Check for updates" button can tell which build is newer.
      - name: Set version
        shell: bash
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Publish single-file .exe
        run: >
          dotnet publish src/MultiAIChatbot/MultiAIChatbot.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.APP_VERSION }}
          -o publish

      # Start the app for 20 seconds and fail the build if it crashes while
      # opening, so a broken build never becomes a release.
      - name: Smoke test (app starts without crashing)
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'MultiAIChatbot\crash.log'
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process -FilePath 'publish\MultiAIChatbot.exe' -PassThru
          Start-Sleep -Seconds 20
          $crashed = (Test-Path $log) -and (Select-String -Path $log -Pattern 'Unhandled error' -Quiet)
          $exited = $p.HasExited
          if (-not $exited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) { Get-Content $log }
          if ($crashed) { Write-Error 'The app hit an unhandled error at startup (see crash.log above).'; exit 1 }
          if ($exited -and $p.ExitCode -ne 0) { Write-Error "The app exited at startup with code $($p.ExitCode)."; exit 1 }
          Write-Host 'App started and stayed open.'

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: MultiAIChatbot-win-x64
          path: publish/MultiAIChatbot.exe

      # Every push to main becomes a GitHub Release. The app downloads its
      # updates from the latest release (no sign-in needed, unlike Actions artifacts).
      # GitHub's API sometimes has short outages (500/502 errors), so if publishing
      # fails, wait and try again before giving up. Re-running for the same tag
      # updates the existing release, so retries are safe.
      - name: Publish release (main only)
        id: release1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Multi-AI Chatbot ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: 'true'
          files: publish/MultiAIChatbot.exe

      - name: Wait before retrying release
        if: steps.release1.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Publish release (retry)
        id: release2
        if: steps.release1.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Multi-AI Chatbot ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: 'true'
          files: publish/MultiAIChatbot.exe

      - name: Wait before last release attempt
        if: steps.release2.outcome == 'failure'
        shell: bash
        run: sleep 240

      - name: Publish release (last try)
        if: steps.release2.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Multi-AI Chatbot ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: 'true'
          files: publish/MultiAIChatbot.exe
